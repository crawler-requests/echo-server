name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (required by //go:embed)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build single binary
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.serverVersion=ci -X main.buildCommit=${GITHUB_SHA}" \
            -o /tmp/echo-server .

      - name: Smoke test embedded UI and injected version
        run: |
          ECHO_SERVER_DB=/tmp/ci-echo.db \
          ECHO_SERVER_ADMIN_USERNAME=ciadmin \
          ECHO_SERVER_ADMIN_PASSWORD='ci-password-123' \
          PORT=18443 HTTP_PORT=18080 /tmp/echo-server > /tmp/echo-ci.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/echo-ci.log' EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:18080/health)" = '{"status":"ok"}'

          # The console must come from the embedded filesystem: HTML + hashed asset.
          curl -fsS http://127.0.0.1:18080/ui/ | grep -q 'id="root"'
          ASSET=$(curl -fsS http://127.0.0.1:18080/ui/ | grep -oE '/ui/assets/[^"]+\.js' | head -1)
          test -n "$ASSET"
          curl -fsS -o /dev/null "http://127.0.0.1:18080$ASSET"

          # ldflags must reach /api/system.
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18080/api/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciadmin","password":"ci-password-123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://127.0.0.1:18080/api/system \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["version"]=="ci", d; assert d["build_commit"], d'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t echo-server:ci .

      - name: Run container and check the console
        run: |
          docker run -d --name echo-ci -p 18081:8080 \
            -e ECHO_SERVER_ADMIN_USERNAME=ciadmin \
            -e ECHO_SERVER_ADMIN_PASSWORD='ci-password-123' \
            echo-server:ci
          trap 'docker logs echo-ci; docker rm -f echo-ci' EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:18081/health)" = '{"status":"ok"}'
          curl -fsS http://127.0.0.1:18081/ui/ | grep -q 'id="root"'
